<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>simCAT by Cheries</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--primary:#7c1d2b;--primary-strong:#5a1420;--bg:#fdf8f5;--card:#fff;--border:#e7ddd9;--text:#2b1a1d;--text-strong:#1a0f11;--text-muted:#8a6d72;--text-faint:#b89ca1;--accent:#f8ecea;--shadow:0 4px 20px rgba(124,29,43,0.08);--shadow-md:0 8px 30px rgba(124,29,43,0.12);--shadow-lg:0 16px 50px rgba(124,29,43,0.16);--radius:16px;--font-heading:'Plus Jakarta Sans',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace}
[data-theme='black']{--primary:#e85d4a;--primary-strong:#ff7a66;--bg:#0a0a0a;--card:#171717;--border:#262626;--text:#e5e5e5;--text-strong:#fff;--text-muted:#a3a3a3;--text-faint:#737373;--accent:#1f1f1f}
*{box-sizing:border-box} body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.65}
.mono{font-family:var(--font-mono)} .heading{font-family:var(--font-heading)}
@media(max-width:900px){.bank-layout{grid-template-columns:1fr !important} .dashboard-grid{grid-template-columns:1fr !important}}
</style>
<script>try{var href=[".","/","theme",".css"].join("").replace("//","/"); var id="theme-css-link"; var l=document.getElementById(id); if(!l){l=document.createElement("link"); l.id=id; l.rel="stylesheet"; l.onerror=function(){try{l.remove()}catch(e){}}; document.head.appendChild(l);} l.href=href+"?t="+Date.now();}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo} = React;
const APP_VERSION = 'v2.8.0 - Multi-correct MCQ + Extended Meta + Favorites + Detail Modal + theme.css';
const MOCK_CONFIG = {appName:"Cognition CAT",companyName:"Atlas Learning Labs",pageTitle:"simCAT by Cheries",logoText:"COGNITION",welcomeTitle:"Assess with precision.",welcomeSubtitle:"Built for institutions that take learning seriously",welcomeText:"File-based CAT on GitPgs. Questions in /questions/, users in user.json.",footerText:"© 2025 Atlas Learning Labs — File-first assessment on GitPgs.",designer:"Designed by Atlas Studio",logoUrl:"",accountCheckIntervalDays:3};
const MOCK_USERS = [{username:"admin",password:"admin123",role:"admin",name:"Alex Morgan"},{username:"teacher",password:"teacher123",role:"teacher",name:"Dr. Evelyn Shaw"},{username:"student",password:"student123",role:"student",name:"Samir Patel"}];
const MOCK_Q_MANIFEST = [
  {level:"easy",group:"english",topic:"grammar-error",path:"./questions/easy/english/grammar-error/question.json",title:"Common Error Spotting",description:"Identify incorrect word",creator:"Cheries",levelLabel:"easy",topics:["grammar","error-spotting"],updatedAt:"2025-11-04",typeCounts:{click_correct:2,mcq:1}},
  {level:"easy",group:"english",topic:"multi-error",path:"./questions/easy/english/multi-error/question.json",title:"Multi-Error Spotting (New)",description:"Multiple errors",creator:"Cheries",levelLabel:"easy",topics:["grammar","multi-error"],updatedAt:"2025-11-04",typeCounts:{multi_error:4}},
  {level:"intermediate",group:"english",topic:"reading",path:"./questions/intermediate/english/reading/question.json",title:"Reading Comprehension — Climate",description:"Read passage",creator:"Atlas",levelLabel:"intermediate",topics:["reading"],updatedAt:"2025-11-02",typeCounts:{passage_mcq:1,mcq:1}},
  {level:"advance",group:"math",topic:"psychotest",path:"./questions/advance/math/psychotest/question.json",title:"Visual Reasoning & Logic",description:"Image reasoning",creator:"Atlas",levelLabel:"advance",topics:["logic","visual"],updatedAt:"2025-10-20",typeCounts:{image_mcq:1,mcq:1}},
];
const MOCK_Q_FILES = {
  "./questions/easy/english/grammar-error/question.json": {meta:{title:"Common Error Spotting",description:"Identify incorrect word and provide correction. Case insensitive, accepts contractions.",timeLimits:{fast:5,normal:10,easy:20},creator:"Cheries",level:"easy",topics:["grammar"],updatedAt:"2025-11-04"},questions:[
    {id:"q1",type:"click_correct",question:"Select the incorrect word in the sentence and type the correct form.",sentence:"She doesn't likes to be interrupted during her research.",tokens:["She","doesn't","likes","to","be","interrupted","during","her","research."],incorrectIndex:2,correctAnswers:["like"],explanation:"With auxiliary doesn't, base form like is required."},
    {id:"q2",type:"click_correct",question:"Find the error.",sentence:"They was planning to visit the museum yesterday.",tokens:["They","was","planning","to","visit","the","museum","yesterday."],incorrectIndex:1,correctAnswers:["were"],explanation:"They requires were."},
    {id:"q3",type:"mcq",question:"Choose the correct sentences (multi-correct example):",options:{A:"Each of the students have finished.",B:"Each of the students has finished.",C:"Each of the students has finished their work.",D:"Each students has finished."},correctAnswer:["B","C"],multipleCorrect:true,explanation:"B and C are both grammatical."}
  ]},
  "./questions/intermediate/english/reading/question.json": {meta:{title:"Reading Comprehension — Climate",description:"Read passage and answer.",timeLimits:{fast:7,normal:15,easy:25},creator:"Atlas",level:"intermediate",topics:["reading","climate"],updatedAt:"2025-11-02"},questions:[
    {id:"q1",type:"passage_mcq",passage:"The reversal of ocean currents in the North Atlantic has been linked to abrupt climate shifts. When freshwater influx reduces salinity, density-driven circulation weakens.",question:"What weakens density-driven circulation?",options:{A:"Salinity increase",B:"Freshwater influx",C:"Temperature rise",D:"Wind patterns"},correctAnswer:"B",explanation:"Freshwater influx reduces salinity."},
    {id:"q2",type:"mcq",question:"Which statements are true? (multi-correct)",options:{A:"Ocean currents transport heat",B:"Freshwater increases salinity",C:"Ice cores show abrupt shifts",D:"Climate is static"},correctAnswer:["A","C"],multipleCorrect:true,explanation:"A and C are true per passage."}
  ]},
  "./questions/easy/english/multi-error/question.json": {meta:{title:"Multi-Error Spotting",description:"Multiple errors",timeLimits:{fast:8,normal:14,easy:25},creator:"Cheries"},questions:[
    {id:"q_multi1",type:"multi_error",question:"Identify all errors.",sentence:"The students was planning to visit the museum yesterday.",multiErrorSegments:[{id:"s0",text:"The students",clickable:false},{id:"s1",text:"was",clickable:true,isError:true,correctAnswers:["were"]},{id:"s2",text:"planning to visit the museum yesterday.",clickable:false}],explanation:"Plural requires were."}
  ]}
};
function normalizeAnswer(s){return s.toLowerCase().trim().replace(/\s+/g,' ').replace(/['’]/g,"'").replace(/\./g,'');}
function checkTypingAnswer(input,valid){if(!input) return false; var n=normalizeAnswer(input); return (valid||[]).some(function(v){return normalizeAnswer(v)===n;});}
function getCorrectList(q){try{if(Array.isArray(q.correctAnswers)) return q.correctAnswers.map(function(s){return String(s).trim();}).filter(Boolean); if(Array.isArray(q.correctAnswer)) return q.correctAnswer.map(function(s){return String(s).trim();}).filter(Boolean); if(typeof q.correctAnswers==='string'&&q.correctAnswers.trim()) return [q.correctAnswers.trim()]; if(typeof q.correctAnswer==='string'&&q.correctAnswer.trim()) return [q.correctAnswer.trim()];}catch(e){} return [];}
function isMultiMcq(q){if(!q) return false; if(q.type!=='mcq'&&q.type!=='passage_mcq'&&q.type!=='image_mcq') return false; if(q.multipleCorrect===true||q.allowMultiple===true) return true; return getCorrectList(q).length>1;}
function parseMcqAnswer(ans){if(!ans) return []; try{var p=JSON.parse(ans); if(Array.isArray(p)) return p.map(function(x){return String(x).trim();}).filter(Boolean);}catch(e){} if(ans.indexOf(',')>-1) return ans.split(',').map(function(s){return s.trim();}).filter(Boolean); return [ans.trim()].filter(Boolean);}
function stringifyMcqAnswer(arr){var clean=arr.map(function(s){return s.trim();}).filter(Boolean); if(clean.length<=1) return clean[0]||''; var uniq=[...new Set(clean)].sort(); return JSON.stringify(uniq);}
function checkMcqCorrect(q,userAns){var correct=getCorrectList(q).map(function(s){return s.trim().toUpperCase();}).filter(Boolean); var user=parseMcqAnswer(userAns).map(function(s){return s.trim().toUpperCase();}).filter(Boolean); if(correct.length===0) return false; var c=[...new Set(correct)].sort(); var u=[...new Set(user)].sort(); if(c.length!==u.length) return false; return c.join(',')===u.join(',');}
function getTopicsArray(t){if(!t) return []; if(Array.isArray(t)) return t; return [t];}
function formatTime(s){var sec=Math.max(0,Math.floor(s)); var m=Math.floor(sec/60); var ss=sec%60; return String(m).padStart(2,'0')+":"+String(ss).padStart(2,'0');}
function App(){
  const [route,setRoute] = useState(()=> location.hash.replace('#','') || '/login');
  const [session,setSession] = useState(()=>{try{var v=localStorage.getItem('cat_session'); return v?JSON.parse(v):null;}catch(e){return null;}});
  const [users,setUsers] = useState(MOCK_USERS);
  const [config,setConfig] = useState(MOCK_CONFIG);
  const [qManifest,setQManifest] = useState(MOCK_Q_MANIFEST);
  const [theme,setTheme] = useState(()=> localStorage.getItem('cat_theme')||'light');
  const [selectedManifest,setSelectedManifest] = useState(null);
  const [questions,setQuestions] = useState([]);
  const [answers,setAnswers] = useState({});
  const [currentQIdx,setCurrentQIdx] = useState(0);
  const [timeLeft,setTimeLeft] = useState(0);
  const [totalSeconds,setTotalSeconds] = useState(0);
  const [testStarted,setTestStarted] = useState(false);
  const [showAnswerMode,setShowAnswerMode] = useState(false);
  const [showExplanation,setShowExplanation] = useState(null);
  const [attempts,setAttempts] = useState(()=>{try{var v=localStorage.getItem('cat_results'); var arr=v?JSON.parse(v):[]; return arr.filter(function(x){return x&&x.id;});}catch(e){return [];}});
  const [selectedAttemptId,setSelectedAttemptId] = useState(null);
  const [resultsFilter,setResultsFilter] = useState('all');
  const [favorites,setFavorites] = useState(()=>{try{var sess=JSON.parse(localStorage.getItem('cat_session')||'{}'); var k='cat_favorites_'+(sess.username||'guest'); var v=localStorage.getItem(k); return v?JSON.parse(v):[];}catch(e){return [];}});
  const [testDetail,setTestDetail] = useState(null);
  const [detailTypeCounts,setDetailTypeCounts] = useState(null);
  const [favFilter,setFavFilter] = useState('all');
  const [groupFilter,setGroupFilter] = useState('all');
  const [topicFilter,setTopicFilter] = useState('all');
  const [searchFilter,setSearchFilter] = useState('');
  const [myResultPreview,setMyResultPreview] = useState(null);
  useEffect(()=>{var h=function(){setRoute(location.hash.replace('#','')||'/login');}; window.addEventListener('hashchange',h); return function(){window.removeEventListener('hashchange',h);};},[]);
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme); localStorage.setItem('cat_theme',theme);},[theme]);
  useEffect(()=>{if(!session){location.hash='#/login'; return;} if(route==='/login') location.hash='#/dashboard';},[session]);
  useEffect(()=>{try{localStorage.setItem('cat_results',JSON.stringify(attempts));}catch(e){}},[attempts]);
  useEffect(()=>{try{var k='cat_favorites_'+(session&&session.username?session.username:'guest'); localStorage.setItem(k,JSON.stringify(favorites));}catch(e){}},[favorites]);
  useEffect(()=>{if(!testStarted||timeLeft<=0) return; var id=setInterval(function(){setTimeLeft(function(v){if(v<=1){handleSubmit(); return 0;} return v-1;});},1000); return function(){clearInterval(id);};},[testStarted,timeLeft]);
  const toggleFavorite = function(id){setFavorites(function(prev){var next=prev.includes(id)?prev.filter(function(x){return x!==id;}):[...prev,id]; try{var k='cat_favorites_'+(session&&session.username?session.username:'guest'); localStorage.setItem(k,JSON.stringify(next));}catch(e){} return next;});};
  const handleLogin = function(u,p){var found=users.find(function(x){return x.username===u&&x.password===p;}); if(found){var s={username:found.username,role:found.role,name:found.name}; localStorage.setItem('cat_session',JSON.stringify(s)); setSession(s); location.hash='#/dashboard';} else alert('Invalid credentials');};
  const handleLogout = function(){localStorage.removeItem('cat_session'); setSession(null); location.hash='#/login';};
  const filteredManifest = useMemo(function(){
    return qManifest.filter(function(m){
      if(favFilter==='favorites' && !favorites.includes(m.path)) return false;
      if(groupFilter!=='all' && m.group!==groupFilter) return false;
      if(topicFilter!=='all' && m.topic!==topicFilter) return false;
      if(searchFilter && !(m.title.toLowerCase().includes(searchFilter.toLowerCase()) || m.group.toLowerCase().includes(searchFilter.toLowerCase()) || (m.topics&&getTopicsArray(m.topics).join(' ').toLowerCase().includes(searchFilter.toLowerCase())))) return false;
      return true;
    });
  },[qManifest,favFilter,groupFilter,topicFilter,searchFilter,favorites]);
  const groups = useMemo(function(){return [...new Set(qManifest.map(function(m){return m.group;}))];},[qManifest]);
  const topics = useMemo(function(){return [...new Set(qManifest.filter(function(m){return groupFilter==='all'||m.group===groupFilter;}).map(function(m){return m.topic;}))];},[qManifest,groupFilter]);
  const handleOpenDetail = function(m){
    setTestDetail(m);
    setDetailTypeCounts(null);
    var qf = MOCK_Q_FILES[m.path];
    if(qf){var counts={}; qf.questions.forEach(function(q){counts[q.type]=(counts[q.type]||0)+1;}); setDetailTypeCounts(counts); return;}
    if(m.typeCounts){setDetailTypeCounts(m.typeCounts); return;}
    if(m.counts){setDetailTypeCounts(m.counts); return;}
    try{
      var url = (m.path + "?t=" + Date.now());
      fetch(url,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&j.questions){var counts={}; j.questions.forEach(function(q){counts[q.type]=(counts[q.type]||0)+1;}); setDetailTypeCounts(counts);}}).catch(function(){});
    }catch(e){}
  };
  const handleStartTest = function(m,level){
    var qf = MOCK_Q_FILES[m.path] || {meta:{title:m.title,description:m.description||'',timeLimits:{fast:5,normal:10,easy:20},creator:m.creator,topics:m.topics,updatedAt:m.updatedAt},questions:[]};
    var meta = qf.meta;
    var tl = meta.timeLimits || {fast:5,normal:10,easy:20};
    var secs = level==='fast'? tl.fast*60 : level==='easy'? tl.easy*60 : tl.normal*60;
    setSelectedManifest(Object.assign({},m,{meta:meta}));
    setQuestions(qf.questions);
    setAnswers({});
    setCurrentQIdx(0);
    setTotalSeconds(secs);
    setTimeLeft(secs);
    setTestStarted(true);
    setShowAnswerMode(false);
    setTestDetail(null);
    location.hash='#/test';
  };
  const handleSubmit = function(){
    var score={correct:0,incorrect:0,unanswered:0};
    questions.forEach(function(q){
      var ans=answers[q.id];
      if(!ans){score.unanswered++; return;}
      var ok=false;
      if(q.type==='mcq'||q.type==='passage_mcq'||q.type==='image_mcq'){ok=checkMcqCorrect(q,ans);}
      else if(q.type==='click_correct'){ok=checkTypingAnswer(ans,q.correctAnswers||[]);}
      else if(q.type==='multi_error'){try{var p=JSON.parse(ans); var actual=(q.multiErrorSegments||[]).filter(function(s){return s.clickable&&s.isError;}).map(function(s){return s.id;}).sort().join(','); var sel=(p.selectedIds||[]).sort().join(','); if(actual!==sel) ok=false; else {ok=true; for(var ii=0;ii<p.selectedIds.length;ii++){var id=p.selectedIds[ii]; var seg=(q.multiErrorSegments||[]).find(function(s){return s.id===id;}); if(!seg||!checkTypingAnswer(p.corrections[id]||'',seg.correctAnswers||[])){ok=false; break;}} if(p.noError && actual==='') ok=true;}}catch(e){ok=false;}}
      if(ok) score.correct++; else score.incorrect++;
    });
    var attempt={id:'att_'+Date.now(),date:new Date().toISOString(),manifest:selectedManifest,questions:questions,answers:answers,timeLevel:'normal',score:score};
    setAttempts(function(prev){return [attempt].concat(prev);});
    setTestStarted(false);
    try{ fetch("actions", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "records.list", args: { collection: "attempts" } }) }); }catch(e){}
    try{ fetch("actions", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "records.create", args: { collection: "attempts", value: attempt } }) }); }catch(e){}
    location.hash='#/results';
    setSelectedAttemptId(attempt.id);
  };
  var currentQ = questions[currentQIdx];
  var selectedAttempt = attempts.find(function(a){return a.id===selectedAttemptId;}) || attempts[0] || null;
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <header style={{position:'sticky',top:0,zIndex:10,background:'rgba(255,255,255,0.85)',backdropFilter:'blur(12px)',borderBottom:'1px solid var(--border)',padding:'12px 20px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}} onClick={()=>location.reload()}>
          <div style={{width:32,height:32,borderRadius:8,background:'var(--primary)',display:'grid',placeItems:'center',color:'white',fontWeight:700,fontFamily:'var(--font-heading)'}}>{(config.logoText||'C')[0]}</div>
          <div><div className="heading" style={{fontWeight:700,fontSize:14}}>{config.appName}</div><div className="mono" style={{fontSize:10,color:'var(--text-muted)'}}>{APP_VERSION} • GitPgs</div></div>
          <span className="mono" style={{fontSize:9,fontWeight:700,padding:'3px 7px',borderRadius:999,background:'var(--accent)',border:'1px solid var(--border)',marginLeft:8}}>{APP_VERSION}</span>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <select value={theme} onChange={function(e){setTheme(e.target.value);}} className="mono" style={{padding:'6px 10px',borderRadius:8,border:'1px solid var(--border)',background:'var(--card)',fontSize:11}}><option value="light">Light</option><option value="black">Dark</option></select>
          {session && <button onClick={handleLogout} className="mono" style={{padding:'6px 12px',borderRadius:8,border:'1px solid var(--border)',background:'var(--card)',cursor:'pointer',fontSize:11}}>LOGOUT</button>}
        </div>
      </header>
      <nav style={{display:'flex',gap:8,padding:'12px 20px',flexWrap:'wrap',background:'var(--card)',borderBottom:'1px solid var(--border)'}}>
        {[
          {href:'#/dashboard',label:'Dashboard',roles:['admin','teacher','student']},
          {href:'#/test',label:'Take Test',roles:['admin','teacher','student']},
          {href:'#/results',label:'My Results',roles:['admin','teacher','student']},
          {href:'#/files',label:'Files',roles:['admin','teacher','student']},
          {href:'#/about',label:'About',roles:['admin','teacher','student']},
          {href:'#/admin',label:'Admin',roles:['admin']},
        ].filter(function(l){return !session||l.roles.includes(session.role);}).map(function(l){
          return <a key={l.href} href={l.href} className="mono" style={{padding:'7px 12px',borderRadius:999,border:'1px solid',borderColor:route===l.href.replace('#','')?'var(--primary)':'var(--border)',background:route===l.href.replace('#','')?'var(--accent)':'var(--card)',fontSize:11,fontWeight:600}}>{l.label}</a>;
        })}
      </nav>
      <main style={{flex:1,maxWidth:1280,margin:'0 auto',width:'100%',padding:20}}>
        {route==='/login' && (
          <div style={{maxWidth:400,margin:'60px auto',background:'var(--card)',border:'1px solid var(--border)',borderRadius:20,padding:28,boxShadow:'var(--shadow-md)'}}>
            <h2 className="heading" style={{margin:0,fontSize:22}}>{config.welcomeTitle}</h2><p className="mono" style={{fontSize:12,color:'var(--text-muted)',marginTop:6}}>{config.welcomeSubtitle}</p>
            <div style={{display:'grid',gap:12,marginTop:20}}>
              <input id="u" placeholder="username" className="mono" style={{padding:'12px 14px',borderRadius:10,border:'1px solid var(--border)',background:'var(--bg)'}}/>
              <input id="p" type="password" placeholder="password" className="mono" style={{padding:'12px 14px',borderRadius:10,border:'1px solid var(--border)',background:'var(--bg)'}}/>
              <button onClick={function(){var u=document.getElementById('u').value; var p=document.getElementById('p').value; handleLogin(u,p);}} style={{padding:'12px',borderRadius:10,border:'none',background:'var(--primary)',color:'white',fontWeight:700,cursor:'pointer'}}>LOGIN</button>
              <div className="mono" style={{fontSize:11,color:'var(--text-faint)'}}>admin/admin123 teacher/teacher123 student/student123</div>
            </div>
          </div>
        )}
        {route==='/dashboard' && session && (
          <div style={{display:'grid',gap:20}}>
            <h2 className="heading" style={{fontSize:28,margin:0}}>Dashboard</h2>
            <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:16,padding:20,boxShadow:'var(--shadow)'}}>
              <div className="heading" style={{fontSize:16}}>Welcome {session.name} • {session.role}</div>
              <div className="mono" style={{fontSize:12,color:'var(--text-muted)',marginTop:8}}>{config.welcomeText}</div>
              <div style={{marginTop:12,display:'flex',gap:8,flexWrap:'wrap'}}>{qManifest.slice(0,3).map(function(m){return <span key={m.path} className="mono" style={{fontSize:10,padding:'4px 8px',borderRadius:999,background:'var(--accent)',border:'1px solid var(--border)'}}>{m.title} • {m.creator||'Unknown'} • {getTopicsArray(m.topics).join(', ')||m.topic}</span>;})}</div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:14}}>
              <div style={{background:'var(--card)',border:'1px solid var(--border)',borderLeft:'3px solid var(--primary)',borderRadius:16,padding:16}}><div className="mono" style={{fontSize:10,color:'var(--text-muted)'}}>TOTAL TESTS</div><div className="heading" style={{fontSize:28,fontWeight:800}}>{qManifest.length}</div></div>
              <div style={{background:'var(--card)',border:'1px solid var(--border)',borderLeft:'3px solid #16A34A',borderRadius:16,padding:16}}><div className="mono" style={{fontSize:10,color:'var(--text-muted)'}}>FAVORITES</div><div className="heading" style={{fontSize:28,fontWeight:800,color:'#16A34A'}}>{favorites.length}</div></div>
              <div style={{background:'var(--card)',border:'1px solid var(--border)',borderLeft:'3px solid #CA8A04',borderRadius:16,padding:16}}><div className="mono" style={{fontSize:10,color:'var(--text-muted)'}}>ATTEMPTS</div><div className="heading" style={{fontSize:28,fontWeight:800,color:'#CA8A04'}}>{attempts.length}</div></div>
            </div>
          </div>
        )}
        {route==='/test' && session && (
          <div>
            {!testStarted ? (
              <div style={{display:'grid',gap:20}}>
                <div style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:12,alignItems:'end'}}>
                  <div><h2 className="heading" style={{fontSize:28,margin:0}}>Take Test</h2><p className="mono" style={{fontSize:12,color:'var(--text-muted)'}}>Multi-correct MCQ • Favorites • Detail modal • theme.css</p></div>
                </div>

                      </div>
                      <div style={{fontSize:15,fontWeight:600}}>{qq.question}</div>
                      <div style={{display:'grid',gap:6,fontSize:13}}>
                        {isUnanswered? <div style={{color:'#A16207',background:'#FEFCE8',padding:'8px 12px',borderRadius:10,border:'1px solid #FDE68A',fontWeight:600}}>You provided no answer</div> :
                          isCorrect? <div style={{color:'#15803D',background:'#F0FDF4',padding:'8px 12px',borderRadius:10,border:'1px solid #BBF7D0',fontWeight:600}}>✓ Correct — {parseMcqAnswer(userAns).join(', ')}</div> :
                          <div style={{color:'#B91C1C',background:'#FEF2F2',padding:'8px 12px',borderRadius:10,border:'1px solid #FECACA'}}>Your answer: {parseMcqAnswer(userAns).join(', ')} • Correct: {getCorrectList(qq).join(', ')}</div>
                        }
                        <div style={{background:'var(--accent)',padding:'12px 14px',borderRadius:10,border:'1px solid var(--border)',fontSize:12.5}}><b>Explanation:</b> {qq.explanation}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            {myResultPreview && (
              <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.48)',backdropFilter:'blur(10px)',zIndex:60,display:'grid',placeItems:'center',padding:20}}>
                <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:20,width:'100%',maxWidth:'95vw',maxHeight:'90vh',display:'flex',flexDirection:'column',overflow:'hidden',boxShadow:'var(--shadow-lg)'}}>
                  <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',background:'var(--accent)'}}>
                    <div className="mono" style={{fontSize:12,fontWeight:600}}>PREVIEW • Q {myResultPreview.originalIdx+1} • {myResultPreview.qq.type.toUpperCase()} • {myResultPreview.qq.id} {isMultiMcq(myResultPreview.qq)?'• MULTI-CORRECT':''}</div>
                    <button onClick={function(){setMyResultPreview(null);}} style={{padding:'6px 10px',borderRadius:8,border:'1px solid var(--border)',background:'var(--card)',cursor:'pointer'}}>✕</button>
                  </div>
                  <div style={{flex:1,overflow:'auto',padding:20,display:'grid',gap:14,background:'var(--bg)'}}>
                    <div className="mono" style={{fontSize:11}}>TEST: {myResultPreview.attempt.manifest && myResultPreview.attempt.manifest.title} • Q {myResultPreview.originalIdx+1}/{myResultPreview.attempt.questions.length} [{myResultPreview.qq.type.toUpperCase()}]</div>
                    <div style={{fontSize:16,fontWeight:600}}>{myResultPreview.qq.question}</div>
                    {myResultPreview.qq.passage && <div style={{background:'var(--accent)',padding:14,borderRadius:12,border:'1px solid var(--border)',fontSize:13}}>{myResultPreview.qq.passage}</div>}
                    {(myResultPreview.qq.type==='mcq'||myResultPreview.qq.type==='passage_mcq'||myResultPreview.qq.type==='image_mcq') && (
                      <div style={{display:'grid',gap:8}}>{Object.entries(myResultPreview.qq.options||{}).map(function(entry){var k=entry[0]; var v=entry[1]; var userSel=parseMcqAnswer(myResultPreview.attempt.answers && myResultPreview.attempt.answers[myResultPreview.qq.id]).includes(k); var correctList=getCorrectList(myResultPreview.qq); var isCorrectOpt=correctList.includes(k); var border='1px solid var(--border)'; var bg='var(--card)'; var badge=''; if(isCorrectOpt){border='2px solid #16A34A'; bg='#F0FDF4'; badge=' ✓ Correct';} if(userSel && !isCorrectOpt){border='2px solid #DC2626'; bg='#FEF2F2'; badge=' ✗ Your answer';} if(userSel && isCorrectOpt){badge=' ✓ Your answer + Correct';} return <div key={k} style={{padding:'10px 14px',borderRadius:10,border:border,background:bg}}><b>{k}.</b> {v}<b style={{marginLeft:8,color:isCorrectOpt?'#16A34A':'#DC2626'}}>{badge}</b></div>;})}</div>
                    )}
                    <div style={{background:'var(--accent)',padding:'12px 14px',borderRadius:10,border:'1px solid var(--border)',fontSize:12.5}}><b>Explanation:</b> {myResultPreview.qq.explanation}</div>
                    <div className="mono" style={{fontSize:11,color:'var(--text-muted)'}}>Correct answers: {getCorrectList(myResultPreview.qq).join(', ')||'—'} • Multi: {isMultiMcq(myResultPreview.qq)?'Yes':'No'}</div>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}
        {route==='/about' && (
          <div style={{display:'grid',gap:20}}>
            <h2 className="heading" style={{fontSize:28,margin:0}}>About</h2>
            <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:16,padding:20}}>
              <h3 className="heading" style={{fontSize:16}}>Theme.css — Easy Theming (GitHub Pages Compatible)</h3>
              <p className="mono" style={{fontSize:12,color:'var(--text-muted)'}}>Add a file named theme.css at repo root (next to index.html). It will be auto-loaded via dynamic link with cache-bust. GitHub Pages serves static files.</p>
              <pre style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:12,padding:14,fontSize:11,overflow:'auto',whiteSpace:'pre-wrap'}}>{`/* theme.css - simCAT by Cheries */
:root{
  --primary:#7c1d2b; --primary-strong:#5a1420;
  --bg:#fdf8f5; --card:#ffffff; --border:#e7ddd9;
  --text:#2b1a1d; --text-strong:#1a0f11; --text-muted:#8a6d72;
  --accent:#f8ecea;
}
[data-theme='black']{
  --primary:#e85d4a; --bg:#0a0a0a; --card:#171717; --border:#262626;
  --text:#e5e5e5; --accent:#1f1f1f;
}
`}</pre>
              <div style={{display:'flex',gap:8,marginTop:12}}>
                <button onClick={function(){var css=document.querySelector('pre').textContent; var blob=new Blob([css],{type:'text/css'}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='theme.css'; a.click(); URL.revokeObjectURL(url);}} className="mono" style={{padding:'8px 12px',borderRadius:8,border:'1px solid var(--border)',background:'var(--card)',cursor:'pointer',fontSize:11}}>DOWNLOAD theme.css TEMPLATE</button>
                <button onClick={function(){try{var href=[".","/","theme",".css"].join("").replace("//","/"); var l=document.getElementById("theme-css-link"); if(!l){l=document.createElement("link"); l.id="theme-css-link"; l.rel="stylesheet"; document.head.appendChild(l);} l.href=href+"?t="+Date.now(); alert('Reloaded theme.css');}catch(e){}}} className="mono" style={{padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--primary)',background:'var(--primary)',color:'white',cursor:'pointer',fontSize:11}}>RELOAD theme.css</button>
              </div>
            </div>
            <div style={{background:'var(--accent)',border:'1px solid var(--border)',borderRadius:16,padding:18}}>
              <div className="mono" style={{fontSize:11,fontWeight:700}}>ABOUT THIS BUILD — {APP_VERSION}</div>
              <div style={{fontSize:13,lineHeight:1.7,color:'var(--text-muted)',marginTop:8}}>
                v2.8.0 fixed: Removed TypeScript casts, pure JS, Babel preset react only. Multi-correct MCQ exact set-match, extended meta creator/level/topics/tags/author/updatedAt/typeCounts, favorites localStorage cat_favorites_username with ★/☆ gold filter ALL|FAVORITES, detail modal 95vw 90vh with detail info + breakdown by type (dynamic → meta.typeCounts → FETCH) + history + START FAST/NORMAL/EASY, theme.css dynamic link GitPgs compatible. Keeps v2.7.03 features: clickable big cards + preview, sticky buttons, files 95vw, roles.json glob, account checker.
              </div>
            </div>
          </div>
        )}
        {route==='/files' && <div><h2 className="heading" style={{fontSize:28}}>Files</h2><p className="mono" style={{fontSize:12,color:'var(--text-muted)'}}>Files manifest from /data/files-manifest.json — preview 95vw 90vh + New Tab support. (Mock files in this build)</p><div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:12,padding:16,marginTop:12}} className="mono"><div style={{fontSize:11}}>MOCK FILES:</div><div style={{fontSize:11,marginTop:8}}>english / beginner / simple_present.pdf<br/>english / intermediate / conditional.pdf</div></div></div>}
        {route==='/admin' && session && session.role==='admin' && (
          <div><h2 className="heading" style={{fontSize:28}}>Admin</h2><pre style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:12,padding:14,fontSize:11,overflow:'auto'}}>{JSON.stringify({users:users,config:config,qManifest:qManifest.slice(0,2)},null,2)}</pre></div>
        )}
      </main>
      <footer style={{borderTop:'1px solid var(--border)',padding:'20px 24px',background:'var(--card)',marginTop:20}}>
        <div style={{maxWidth:1280,margin:'0 auto',display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
          <span className="mono" style={{fontSize:11,color:'var(--text-muted)'}}>{config.footerText} • {APP_VERSION}</span>
          <span className="mono" style={{fontSize:11,color:'var(--text-faint)'}}>{config.designer} • {config.appName} • {new Date().getFullYear()}</span>
        </div>
      </footer>
      {showExplanation && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.48)',backdropFilter:'blur(10px)',zIndex:60,display:'grid',placeItems:'center',padding:20}}>
          <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:20,width:'100%',maxWidth:900,maxHeight:'85vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',background:'var(--accent)'}}><div className="heading" style={{fontSize:14,fontWeight:700}}>EXPLANATION</div><button onClick={function(){setShowExplanation(null);}} style={{padding:'6px 10px',borderRadius:8,border:'1px solid var(--border)',background:'var(--card)',cursor:'pointer'}}>✕</button></div>
            <div style={{flex:1,overflow:'auto',padding:20}} className="mono"><pre style={{whiteSpace:'pre-wrap',fontSize:12,lineHeight:1.7}}>{typeof showExplanation==='string'?showExplanation:JSON.stringify(showExplanation,null,2)}</pre></div>
          </div>
        </div>
      )}
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
