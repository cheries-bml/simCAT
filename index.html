    max-width: 1024px;
  }
}

@media (min-width: 1280px) {
  .container {
    max-width: 1280px;
  }
}

@media (min-width: 1536px) {
  .container {
    max-width: 1536px;
  }
}

.visible {
  visibility: visible;
}

.fixed {
  position: fixed;
}

.block {
  display: block;
}

.inline-block {
  display: inline-block;
}

.flex {
  display: flex;
}

.grid {
  display: grid;
}

.border {
  border-width: 1px;
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root {
  --surface: #ffffff;
  --surface-muted: #f4f2ed;
  --text: #1a1a1a;
  --accent: #1d4ed8;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #111111;
    --surface-muted: #1c1c1c;
    --text: #f4f2ed;
    --accent: #93c5fd;
  }
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--surface);
  color: var(--text);
}

* {
  box-sizing: border-box;
}

il.",multiErrorSegments:[{id:"s0",text:"In spite of",clickable:!0,isError:!0,correctAnswers:["Although","Though","In spite of the fact that","Despite the fact that","Despite"]},{id:"s1",text:"he was tired,",clickable:!1},{id:"s2",text:"he continued working because he",clickable:!1},{id:"s3",text:"didn't wanted",clickable:!0,isError:!0,correctAnswers:["didn't want","did not want"]},{id:"s4",text:"to fail.",clickable:!1}],explanation:"Clause-level: 'In spite of' needs noun clause or change to Although/Despite. 'didn't wanted' -> base form wanted -> want after didn't."}]},"./questions/intermediate/english/reading/question.json":{meta:{title:"Reading Comprehension — Climate",description:"Read passage and answer.",timeLimits:{fast:7,normal:15,easy:25}},questions:[{id:"q1",type:"passage_mcq",passage:"The reversal of ocean currents in the North Atlantic has been linked to abrupt climate shifts. When freshwater influx reduces salinity, density-driven circulation weakens, causing heat transport to stall. Evidence from ice cores suggests such events triggered temperature drops of 5°C within decades.",question:"What weakens density-driven circulation?",options:{A:"Salinity increase",B:"Freshwater influx",C:"Temperature rise",D:"Wind patterns"},correctAnswer:"B",explanation:"Passage states freshwater influx reduces salinity, weakening circulation."},{id:"q2",type:"passage_mcq",passage:"The reversal of ocean currents in the North Atlantic has been linked to abrupt climate shifts. When freshwater influx reduces salinity, density-driven circulation weakens, causing heat transport to stall. Evidence from ice cores suggests such events triggered temperature drops of 5°C within decades.",question:"Ice core evidence indicates:",options:{A:"Gradual warming of 1°C",B:"Sudden drops of 5°C in decades",C:"No correlation with currents",D:"Salinity increase causes warming"},correctAnswer:"B",explanation:"Ice cores show temperature drops of 5°C within decades."},{id:"q3",type:"mcq",question:"Author's tone is:",options:{A:"Speculative but evidence-based",B:"Dismissive",C:"Humorous",D:"Alarmist without data"},correctAnswer:"A",explanation:"Author links hypotheses to ice core evidence."}]},"./questions/advance/math/psychotest/question.json":{meta:{title:"Visual Reasoning & Logic",description:"Image-based reasoning.",timeLimits:{fast:6,normal:12,easy:20}},questions:[{id:"q1",type:"image_mcq",question:"If pattern continues, which completes the sequence? (Visual: ▲ ■ ● → ■ ● ▲ → ? )",image:"https://images.unsplash.com/photo-1639322537224-f01285785c00?w=400&h=200&fit=crop",options:{A:"● ▲ ■",B:"▲ ● ■",C:"● ■ ▲",D:"■ ▲ ●"},correctAnswer:"A",explanation:"Rotation: each row shifts left. ▲■● → ■●▲ → ●▲■."},{id:"q2",type:"mcq",question:"What is next: 2, 6, 12, 20, 30, ?",options:{A:"40",B:"42",C:"44",D:"48"},correctAnswer:"B",explanation:"Pattern n*(n+1): 1*2=2, 2*3=6, 3*4=12, 4*5=20, 5*6=30, 6*7=42."}]},"./questions/easy/demo/multi-correct/question.json":{meta:{title:"Demo — Multi-Correct MCQ",description:"Demo set for multi-correct MCQ. Some questions have more than one correct answer. For multi-correct, options use checkbox (not radio).",timeLimits:{fast:4,normal:8,easy:15}},questions:[{id:"DEMO-MULTI-001",type:"mcq",question:"Which of the following are prime numbers? (Select all that apply)",options:{A:"2",B:"4",C:"3",D:"6"},correctAnswer:["A","C"],explanation:"2 and 3 are prime. 4 and 6 are composite."},{id:"DEMO-MULTI-002",type:"mcq",question:"Which of the following are vowels? (Select all that apply)",options:{A:"A",B:"E",C:"K",D:"T"},correctAnswer:["A","B"],explanation:"A and E are vowels."},{id:"DEMO-MULTI-003",type:"passage_mcq",passage:"Water, sunlight, and carbon dioxide are needed for photosynthesis. Oxygen is released as a by-product.",question:"Which inputs are needed for photosynthesis? (Select all that apply)",options:{A:"Water",B:"Sunlight",C:"Oxygen",D:"Carbon dioxide"},correctAnswer:["A","B","D"],explanation:"Water, sunlight and carbon dioxide are inputs; oxygen is released."},{id:"DEMO-MULTI-004",type:"image_mcq",question:"Which shapes have exactly three sides? (Select all that apply)",image:"https://images.unsplash.com/photo-1639322537224-f01285785c00?w=400&h=200&fit=crop",options:{A:"Triangle",B:"Square",C:"Triangle (rotated)",D:"Circle"},correctAnswer:["A","C"],explanation:"Both triangles have three sides, regardless of rotation."}]},"./questions/easy/history/ancient-egypt/question.json":{meta:{title:"Ancient Egypt Basics",description:"Foundational history.",timeLimits:{fast:4,normal:8,easy:15}},questions:[{id:"q1",type:"mcq",question:"Who unified Upper and Lower Egypt?",options:{A:"Tutankhamun",B:"Narmer (Menes)",C:"Ramses II",D:"Cleopatra"},correctAnswer:"B",explanation:"Narmer Palette documents unification."},{id:"q2",type:"click_correct",question:"Correct the factually incorrect word.",sentence:"The Great Pyramid of Giza was built in Rome as a tomb.",tokens:["The","Great","Pyramid","of","Giza","was","built","in","Rome","as","a","tomb."],incorrectIndex:8,correctAnswers:["Giza","Egypt"],explanation:"Built in Giza, Egypt, not Rome."}]}},jp=[{group:"syllabus",topic:"general",name:"Math Syllabus 2025.pdf",path:"./files/syllabus/math-2025.pdf",type:"pdf"},{group:"syllabus",topic:"reading",name:"English Reading Guide.txt",path:"./files/syllabus/english-guide.txt",type:"txt"},{group:"past-papers",topic:"general",name:"Sample Questions.md",path:"./files/past-papers/sample.md",type:"md"},{group:"past-papers",topic:"psychotest",name:"Psychotest Examples.pdf",path:"./files/past-papers/psychotest.pdf",type:"pdf"},{group:"english",topic:"grammar",name:"Grammar1.pdf",path:"files/english/grammar/Grammar.pdf",type:"pdf"},{group:"english",topic:"vocab",name:"Vocab Essentials.pdf",path:"files/english/vocab/Vocab.pdf",type:"pdf"},{group:"math",topic:"algebra",name:"Algebra.pdf",path:"files/math/algebra/Algebra.pdf",type:"pdf"},{group:"math",topic:"geometry",name:"Geometry Notes.txt",path:"files/math/geometry/Geometry.txt",type:"txt"},{group:"history",name:"Ancient Egypt Overview.pdf",path:"./files/history/overview.pdf",type:"pdf"}],bp={name:"Atlas Learning Labs",email:"hello@atlas-labs.edu",phone:"+1 (555) 014-2030",address:"12 Archive Row, Boston MA",developer:"Atlas Studio — CAT Edition",github:"github.com/atlas-labs/cat"},ke={id:"GRAM-0001",slug:"third-conditional",topic:{name:{en:"Conditional Sentences",id:"Kalimat Pengandaian"},category:"Conditionals",subtopic:{en:"Third Conditional",id:"Conditional Tipe Ketiga"},description:{en:"The third conditional is used to talk about imaginary situations in the past and their hypothetical results.",id:"Third conditional digunakan untuk membicarakan situasi imajiner di masa lalu dan hasil yang mungkin terjadi jika situasi tersebut berbeda."}},wrong_correct:[{wrong:"If I would have studied harder, I would have passed the exam.",correct:"If I had studied harder, I would have passed the exam.",explanation:{en:"In a standard third conditional sentence, we use the past perfect (had + past participle) in the if-clause, not would have + past participle. We use would have + past participle in the main clause to describe the hypothetical result.",id:"Dalam kalimat third conditional standar, kita menggunakan past perfect (had + past participle) pada if-clause, bukan would have + past participle. Kita menggunakan would have + past participle pada main clause untuk menjelaskan hasil yang dibayangkan."}},{wrong:"If she had come earlier, she would pass the exam.",correct:"If she had come earlier, she would have passed the exam.",explanation:{en:"The sentence describes an imaginary past condition and an imaginary past result. Therefore, the main clause should use would have + past participle rather than would + base verb.",id:"Kalimat ini menggambarkan kondisi imajiner di masa lalu dan hasil imajiner di masa lalu. Oleh karena itu, main clause harus menggunakan would have + past participle, bukan would + kata kerja dasar."}}],details_explanation:{en:{introduction:"The third conditional is a grammatical structure used to talk about imaginary or unreal situations in the past. It describes something that did not happen and imagines a different result. We often use it to express regret, criticism, disappointment, or to imagine alternative past events.",rules:[{title:"1. Basic Sentence Structure",explanation:"A third conditional sentence generally consists of two clauses: an if-clause that describes an imaginary past condition and a main clause that describes its hypothetical past result.",structure:"If + subject + had + V3, subject + would have + V3.",notes:["V3 means the past participle form of a verb.","The if-clause describes something that did not happen.","The main clause describes a result that did not happen.","The clauses can change positions without changing the meaning."]},{title:"2. The If-Clause",explanation:"The if-clause uses the past perfect tense. The past perfect is formed using had followed by the past participle (V3).",structure:"If + subject + had + V3",notes:["Had is used with all subjects.","Had can be contracted to 'd in informal writing and speech.","The past perfect refers to an unreal past condition in this structure."]},{title:"3. The Main Clause",explanation:"The main clause normally uses would have followed by a past participle to express an imaginary result in the past. Other modal verbs such as could have and might have can also be used, depending on the intended meaning.",structure:"Subject + would/could/might have + V3",notes:["Would have describes a hypothetical result.","Could have describes a hypothetical possibility or ability.","Might have describes a less certain hypothetical result."]},{title:"4. Meaning and Time Reference",explanation:"Although both clauses use perfect forms, the third conditional refers to an unreal past situation. It does not describe something that is still possible to change.",structure:"Unreal past condition → Hypothetical past result",notes:["The actual past situation is different from the imagined situation.","The condition and result are both situated in the past.","It is frequently used to express regret."]},{title:"5. Changing Clause Positions",explanation:"The if-clause can appear before or after the main clause. When the if-clause comes first, we normally place a comma between the clauses. When the main clause comes first, a comma is generally unnecessary.",structure:"If + past perfect, would have + V3. OR Would have + V3 if + past perfect.",notes:["If I had known, I would have helped you.","I would have helped you if I had known.","Both sentences have the same meaning."]}],common_mistakes:[{wrong:"If I would have known, I would have helped you.",correct:"If I had known, I would have helped you.",reason:"Do not normally use would have in the if-clause of a standard third conditional sentence."},{wrong:"If he had studied, he would passed.",correct:"If he had studied, he would have passed.",reason:"The main clause requires would have followed by V3."},{wrong:"If she has studied, she would have passed.",correct:"If she had studied, she would have passed.",reason:"The standard third conditional requires past perfect in the if-clause."}]},id:{introduction:"Third conditional adalah struktur tata bahasa yang digunakan untuk membicarakan situasi imajiner atau tidak nyata di masa lalu. Struktur ini menjelaskan sesuatu yang sebenarnya tidak terjadi dan membayangkan hasil yang berbeda. Kita sering menggunakannya untuk mengungkapkan penyesalan, kritik, kekecewaan, atau membayangkan kejadian alternatif di masa lalu.",rules:[{title:"1. Struktur Dasar Kalimat",explanation:"Kalimat third conditional umumnya terdiri dari dua klausa: if-clause yang menjelaskan kondisi imajiner di masa lalu dan main clause yang menjelaskan hasil hipotetis dari kondisi tersebut.",structure:"If + subject + had + V3, subject + would have + V3.",notes:["V3 berarti bentuk past participle dari kata kerja.","If-clause menjelaskan sesuatu yang tidak terjadi.","Main clause menjelaskan hasil yang juga tidak terjadi.","Posisi kedua klausa dapat ditukar tanpa mengubah makna."]},{title:"2. If-Clause",explanation:"If-clause menggunakan past perfect tense. Past perfect dibentuk dengan menggunakan had yang diikuti oleh past participle (V3).",structure:"If + subject + had + V3",notes:["Had digunakan untuk semua subject.","Had dapat disingkat menjadi 'd dalam percakapan dan tulisan informal.","Past perfect dalam struktur ini mengacu pada kondisi masa lalu yang tidak nyata."]},{title:"3. Main Clause",explanation:"Main clause biasanya menggunakan would have yang diikuti past participle untuk menyatakan hasil imajiner di masa lalu. Modal verb lain seperti could have dan might have juga dapat digunakan sesuai dengan makna yang ingin disampaikan.",structure:"Subject + would/could/might have + V3",notes:["Would have menjelaskan hasil yang dibayangkan.","Could have menjelaskan kemungkinan atau kemampuan hipotetis.","Might have menjelaskan hasil hipotetis yang tingkat kepastiannya lebih rendah."]},{title:"4. Makna dan Keterangan Waktu",explanation:"Meskipun kedua klausa menggunakan bentuk perfect, third conditional mengacu pada situasi masa lalu yang tidak nyata. Struktur ini tidak menjelaskan sesuatu yang masih dapat diubah.",structure:"Kondisi masa lalu yang tidak nyata → Hasil hipotetis di masa lalu",notes:["Situasi masa lalu yang sebenarnya berbeda dari situasi yang dibayangkan.","Kondisi dan hasil sama-sama mengacu pada masa lalu.","Struktur ini sering digunakan untuk mengungkapkan penyesalan."]},{title:"5. Mengubah Posisi Klausa",explanation:"If-clause dapat ditempatkan sebelum atau sesudah main clause. Jika if-clause berada di awal kalimat, biasanya kita menggunakan koma di antara kedua klausa. Jika main clause berada di awal, koma umumnya tidak diperlukan.",structure:"If + past perfect, would have + V3. ATAU Would have + V3 if + past perfect.",notes:["If I had known, I would have helped you.","I would have helped you if I had known.","Kedua kalimat memiliki makna yang sama."]}],common_mistakes:[{wrong:"If I would have known, I would have helped you.",correct:"If I had known, I would have helped you.",reason:"Dalam third conditional standar, jangan menggunakan would have pada if-clause."},{wrong:"If he had studied, he would passed.",correct:"If he had studied, he would have passed.",reason:"Main clause membutuhkan would have yang diikuti V3."},{wrong:"If she has studied, she would have passed.",correct:"If she had studied, she would have passed.",reason:"Third conditional standar membutuhkan past perfect pada if-clause."}]}},other_examples:[{sentence:"If I had woken up earlier, I would not have missed the bus.",translation:"Jika saya bangun lebih awal, saya tidak akan ketinggalan bus.",explanation:{en:"The speaker woke up late and missed the bus. The sentence imagines a different past situation.",id:"Pembicara bangun terlambat dan ketinggalan bus. Kalimat ini membayangkan situasi masa lalu yang berbeda."}},{sentence:"If they had invited me, I would have attended the party.",translation:"Jika mereka mengundang saya, saya pasti sudah menghadiri pesta tersebut.",explanation:{en:"They did not invite the speaker, so the speaker did not attend the party.",id:"Mereka tidak mengundang pembicara, sehingga pembicara tidak menghadiri pesta tersebut."}},{sentence:"If she had taken the medicine, she might have recovered sooner.",translation:"Jika dia meminum obat tersebut, mungkin dia sudah pulih lebih cepat.",explanation:{en:"The sentence describes a hypothetical possibility. Might have indicates that the result is uncertain.",id:"Kalimat ini menjelaskan kemungkinan hipotetis. Might have menunjukkan bahwa hasilnya tidak pasti."}},{sentence:"If I had had enough money, I could have bought that laptop.",translation:"Jika saya memiliki cukup uang, saya mungkin bisa membeli laptop itu.",explanation:{en:"The first had is the past perfect auxiliary, while the second had is the past participle of have. The speaker did not have enough money and could not buy the laptop.",id:"Had yang pertama merupakan auxiliary verb untuk past perfect, sedangkan had yang kedua merupakan past participle dari have. Pembicara tidak memiliki cukup uang sehingga tidak bisa membeli laptop tersebut."}}],references:[{title:"Conditionals: if",author:"Cambridge Dictionary - English Grammar Today",url:"https://dictionary.cambridge.org/grammar/british-grammar/conditionals-if",type:"grammar_reference"},{title:"Conditionals: zero, first and second",author:"British Council - LearnEnglish",url:"https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/conditionals-zero-first-second",type:"grammar_reference"},{title:"Conditionals",author:"British Council - LearnEnglish Teens",url:"https://learnenglishteens.britishcouncil.org/grammar/b1-b2-grammar/conditionals",type:"learning_resource"}],metadata:{difficulty:"intermediate",tags:["conditionals","third-conditional","past-perfect","modal-verbs","hypothetical-situations"],created_at:"2026-10-30T00:00:00Z",updated_at:"2026-10-30T00:00:00Z",version:1}};function n0({data:n,isDark:nt,section:Sc}){
